name: 機器人自動更新範例2
on:
  push:
    branches: [ Dev5 ] # 當 Dev5 分支有新的推送時觸發

jobs:
  build:
    runs-on: ubuntu-latest

    # 必須給予權限，機器人才能開 PR 和寫入內容
    permissions:
      contents: write
      pull-requests: write

    steps:
    # Step 1: 複製專案程式碼到機器人環境中
    - name: 複製程式碼
      uses: actions/checkout@v4

    # Step 2: 讓機器人執行修改程式碼的動作
    - name: 修改檔案內容
      run: |
        echo "最後更新時間: $(date)" >> readme.txt

    # Step 3: 自動建立 Pull Request
    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v7
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        committer: github-actions[bot] <41898282+github-actions[bot]@://github.com>
        author: github-actions[bot] <41898282+github-actions[bot]@://github.com>
        branch: bot-auto-update # 機器人會自己開這個新分支來放修改後的程式碼
        base: Dev5             # 目標是要合併回 Dev5 分支
        title: "🤖 自動更新: 更新最後修改時間"
        body: |
          此 PR 由 GitHub Actions 自動建立。
          更新了 `readme.txt` 的最後修改時間。
        commit-message: "🤖 自動更新: 更新最後修改時間 [skip ci]"