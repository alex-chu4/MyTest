name: 機器人自動更新範例

on:
  push:
    branches: [ Dev5 ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Step 1: 複製專案程式碼
    - name: 複製程式碼
      uses: actions/checkout@v4
      with:
        ref: Dev5

    # Step 2: 修改檔案內容
    - name: 修改檔案內容
      run: |
        echo "最後更新時間: $(date)" >> readme.txt

    # Step 3: 🔥 改用官方認證的自動提交套件（會自動附帶 Verified 簽章）
    - name: 自動提交與推送 (帶有 Verified 標籤)
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "🤖 自動更新: 更新最後修改時間 [skip ci]"
        branch: Dev5
        file_pattern: 'readme.txt'
        commit_user_name: "github-actions[bot]"
        commit_user_email: "41898282+github-actions[bot]@://github.com"